<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 아이 소아과 찾기</title>
<style>
:root{--navy:#34447a;--blue:#6c9cf0;--blue-d:#4a7fe0;--bg:#f4f9f2;--line:#d9e6f4;--text:#2a3350;--mute:#6b7894;--side:#dcebfa}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.55}
.wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
/* 왼쪽: 검색 조건 */
aside{background:var(--side);color:var(--navy);padding:32px 26px;position:relative;overflow:hidden}
aside h1{font-size:26px;margin:0 0 6px}
aside p.sub{margin:0 0 26px;color:var(--mute);font-size:15px}
fieldset{border:0;padding:0;margin:0 0 22px;position:relative}
.fs-deco{position:absolute;pointer-events:none}.fs-deco svg{display:block;width:100%;height:auto}
legend{font-weight:700;margin-bottom:10px;font-size:16px}
select{width:100%;padding:12px;border-radius:8px;border:0;font-size:16px;margin-bottom:8px}
label.opt{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:16px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--blue)}
button#go{width:100%;padding:15px;border:0;border-radius:10px;background:#3f73d8;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
button#go:hover{background:#335fb8}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
/* 오른쪽: 결과 */
main{padding:28px 30px}
.notice{background:#fff8e1;border:1px solid #f1d98a;border-radius:10px;padding:12px 16px;font-size:14.5px;margin-bottom:16px}
#status{font-weight:700;color:var(--navy);margin:6px 0 14px;font-size:18px}
#error{background:#fdecec;border:1px solid #f3b4b4;color:#8a1c1c;border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;white-space:pre-line}
#map{height:300px;border-radius:12px;background:#dfe8f7;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:16px;margin-bottom:18px}
#list{display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 2px #bfd3fb}
.card h3{margin:0 0 6px;font-size:19px;color:var(--navy)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:#ffe9c9;color:#8a5a1c;margin-bottom:8px}
.card dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:15px}
.card dt{color:var(--mute)}.card dd{margin:0}
.card a{color:var(--blue-d);font-weight:700}
/* 동물 캐릭터·나무·나뭇잎 장식 */
.scene{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:26px}
.scene svg{width:76px;height:auto}.scene .tree{width:62px}
.leaf-a{position:absolute;top:14px;right:16px;width:34px}
.hero{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;height:110px;margin-bottom:6px}
.hero svg{height:100%;width:auto}.hero .tree{height:78%}.hero .leaf{height:34%}
@media(max-width:820px){.wrap{grid-template-columns:1fr}main{padding:20px 16px}.card dl{grid-template-columns:92px 1fr}}
</style>
</head>
<body>
<div class="wrap">
<aside>
  <h1>우리 아이 소아과 찾기</h1>
  <p class="sub">야간·휴일에도 진료 가능한 병원을 찾아보세요.</p>
  <fieldset>
    <legend>지역 선택</legend>
    <select disabled><option>서울특별시</option></select>
    <select id="gu"></select>
  </fieldset>
  <fieldset>
    <legend>진료 희망 시간</legend>
    <label class="opt"><input type="checkbox" id="night">야간</label>
    <label class="opt"><input type="checkbox" id="holiday">휴일</label>
    <label class="opt"><input type="checkbox" id="now">현재 진료 가능</label>
    <span class="fs-deco" style="right:0;top:22px;width:62px"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="18" cy="38" r="17" fill="#b9c3d6"/><circle cx="82" cy="38" r="17" fill="#b9c3d6"/><circle cx="18" cy="38" r="9" fill="#f1d9e2"/><circle cx="82" cy="38" r="9" fill="#f1d9e2"/><circle cx="50" cy="56" r="34" fill="#cfd7e6"/><circle cx="38" cy="52" r="3.5" fill="#3d4559"/><circle cx="62" cy="52" r="3.5" fill="#3d4559"/><ellipse cx="50" cy="62" rx="8" ry="11" fill="#4a5268"/><path d="M43 76q7 5 14 0" stroke="#3d4559" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span><span class="fs-deco" style="right:74px;top:92px;width:24px"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 35C5 15 20 5 35 5c0 20-10 32-30 30z" fill="#a8d8b0"/><path d="M5 35L28 12" stroke="#7fbf8e" stroke-width="2"/></svg></span>
  </fieldset>
  <fieldset>
    <legend>병원 종류 (복수 선택 가능)</legend>
    <label class="opt"><input type="checkbox" id="typeAll" checked>전체</label>
    <label class="opt"><input type="checkbox" class="type" value="달빛어린이병원">달빛어린이병원</label>
    <label class="opt"><input type="checkbox" class="type" value="일반 소아청소년과">일반 소아청소년과</label>
    <label class="opt"><input type="checkbox" class="type" value="소아전문응급의료센터">소아전문응급의료센터</label>
    <span class="fs-deco" style="right:4px;top:26px;width:44px"><svg viewBox="0 0 100 140" aria-hidden="true"><rect x="38" y="52" width="24" height="88" rx="10" fill="#fbe3a1"/><ellipse cx="50" cy="38" rx="22" ry="18" fill="#fbe3a1"/><path d="M40 22v-12M60 22v-12" stroke="#c9a05a" stroke-width="3"/><circle cx="40" cy="9" r="4" fill="#c9a05a"/><circle cx="60" cy="9" r="4" fill="#c9a05a"/><ellipse cx="26" cy="30" rx="7" ry="4" fill="#f4cf7d"/><ellipse cx="74" cy="30" rx="7" ry="4" fill="#f4cf7d"/><circle cx="41" cy="34" r="3" fill="#4a3a30"/><circle cx="59" cy="34" r="3" fill="#4a3a30"/><ellipse cx="50" cy="46" rx="11" ry="7" fill="#fff1cf"/><circle cx="46" cy="46" r="1.5" fill="#4a3a30"/><circle cx="54" cy="46" r="1.5" fill="#4a3a30"/><circle cx="46" cy="75" r="5" fill="#e8b96a"/><circle cx="56" cy="95" r="6" fill="#e8b96a"/><circle cx="45" cy="115" r="5" fill="#e8b96a"/></svg></span><span class="fs-deco" style="right:0;bottom:0;width:42px"><svg viewBox="0 0 80 100" aria-hidden="true"><rect x="35" y="55" width="10" height="42" rx="4" fill="#c9a27e"/><circle cx="40" cy="35" r="26" fill="#bfe3c4"/><circle cx="24" cy="50" r="17" fill="#a8d8b0"/><circle cx="56" cy="50" r="17" fill="#a8d8b0"/></svg></span>
  </fieldset>
  <button id="go">소아과 찾기</button>
  <svg class="leaf-a" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 35C5 15 20 5 35 5c0 20-10 32-30 30z" fill="#a8d8b0"/><path d="M5 35L28 12" stroke="#7fbf8e" stroke-width="2"/></svg>
  <div class="scene"><svg class="tree" viewBox="0 0 80 100" aria-hidden="true"><rect x="35" y="55" width="10" height="42" rx="4" fill="#c9a27e"/><circle cx="40" cy="35" r="26" fill="#bfe3c4"/><circle cx="24" cy="50" r="17" fill="#a8d8b0"/><circle cx="56" cy="50" r="17" fill="#a8d8b0"/></svg><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="24" cy="24" r="13" fill="#d9a77a"/><circle cx="76" cy="24" r="13" fill="#d9a77a"/><circle cx="24" cy="24" r="6" fill="#f3d3b5"/><circle cx="76" cy="24" r="6" fill="#f3d3b5"/><circle cx="50" cy="54" r="38" fill="#e6b88c"/><ellipse cx="50" cy="66" rx="16" ry="12" fill="#f8e3cd"/><circle cx="37" cy="48" r="4" fill="#4a3a30"/><circle cx="63" cy="48" r="4" fill="#4a3a30"/><ellipse cx="50" cy="60" rx="5" ry="3.5" fill="#4a3a30"/><path d="M44 70q6 5 12 0" stroke="#4a3a30" stroke-width="2" fill="none" stroke-linecap="round"/></svg><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="18" cy="38" r="17" fill="#b9c3d6"/><circle cx="82" cy="38" r="17" fill="#b9c3d6"/><circle cx="18" cy="38" r="9" fill="#f1d9e2"/><circle cx="82" cy="38" r="9" fill="#f1d9e2"/><circle cx="50" cy="56" r="34" fill="#cfd7e6"/><circle cx="38" cy="52" r="3.5" fill="#3d4559"/><circle cx="62" cy="52" r="3.5" fill="#3d4559"/><ellipse cx="50" cy="62" rx="8" ry="11" fill="#4a5268"/><path d="M43 76q7 5 14 0" stroke="#3d4559" stroke-width="2" fill="none" stroke-linecap="round"/></svg><svg class="tree" viewBox="0 0 80 100" aria-hidden="true"><rect x="35" y="55" width="10" height="42" rx="4" fill="#c9a27e"/><circle cx="40" cy="35" r="26" fill="#bfe3c4"/><circle cx="24" cy="50" r="17" fill="#a8d8b0"/><circle cx="56" cy="50" r="17" fill="#a8d8b0"/></svg></div>
</aside>
<main>
  <div class="hero"><svg class="leaf" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 35C5 15 20 5 35 5c0 20-10 32-30 30z" fill="#a8d8b0"/><path d="M5 35L28 12" stroke="#7fbf8e" stroke-width="2"/></svg><svg class="tree" viewBox="0 0 80 100" aria-hidden="true"><rect x="35" y="55" width="10" height="42" rx="4" fill="#c9a27e"/><circle cx="40" cy="35" r="26" fill="#bfe3c4"/><circle cx="24" cy="50" r="17" fill="#a8d8b0"/><circle cx="56" cy="50" r="17" fill="#a8d8b0"/></svg><svg viewBox="0 0 100 140" aria-hidden="true"><rect x="38" y="52" width="24" height="88" rx="10" fill="#fbe3a1"/><ellipse cx="50" cy="38" rx="22" ry="18" fill="#fbe3a1"/><path d="M40 22v-12M60 22v-12" stroke="#c9a05a" stroke-width="3"/><circle cx="40" cy="9" r="4" fill="#c9a05a"/><circle cx="60" cy="9" r="4" fill="#c9a05a"/><ellipse cx="26" cy="30" rx="7" ry="4" fill="#f4cf7d"/><ellipse cx="74" cy="30" rx="7" ry="4" fill="#f4cf7d"/><circle cx="41" cy="34" r="3" fill="#4a3a30"/><circle cx="59" cy="34" r="3" fill="#4a3a30"/><ellipse cx="50" cy="46" rx="11" ry="7" fill="#fff1cf"/><circle cx="46" cy="46" r="1.5" fill="#4a3a30"/><circle cx="54" cy="46" r="1.5" fill="#4a3a30"/><circle cx="46" cy="75" r="5" fill="#e8b96a"/><circle cx="56" cy="95" r="6" fill="#e8b96a"/><circle cx="45" cy="115" r="5" fill="#e8b96a"/></svg><svg class="leaf" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 35C5 15 20 5 35 5c0 20-10 32-30 30z" fill="#a8d8b0"/><path d="M5 35L28 12" stroke="#7fbf8e" stroke-width="2"/></svg></div>
  <div class="notice">운영시간은 공공데이터 기준이며 실제 운영 여부와 진료 가능 여부를 보장하지 않습니다. 방문 전 꼭 병원에 전화로 확인하세요.</div>
  <div id="error"></div>
  <div id="status">조건을 선택하고 '소아과 찾기'를 눌러주세요.</div>
  <!-- 지도 영역: 카카오맵은 다음 프롬프트에서 이 자리에 연결합니다 -->
  <div id="map">지도 영역 (카카오맵은 다음 단계에서 연결됩니다)</div>
  <div id="list"></div>
</main>
</div>

<script>
// ===== 설정: 여기에 인증키를 입력하세요 =====
const SERVICE_KEY = "536030c15e457fd3d6de6ea27e463f32a4f3126477b12582ed1e6c6be5fc7268"; // 공공데이터포털 인증키
const KAKAO_KEY = "YOUR_KAKAO_MAP_KEY"; // 카카오맵 키 (다음 단계에서 사용)
const BASE = "https://apis.data.go.kr/B552657/HsptlAsembySearchService/";
// =========================================

const GUS = "강남구,강동구,강북구,강서구,관악구,광진구,구로구,금천구,노원구,도봉구,동대문구,동작구,마포구,서대문구,서초구,성동구,성북구,송파구,양천구,영등포구,용산구,은평구,종로구,중구,중랑구".split(",");
const $ = id => document.getElementById(id);
$("gu").innerHTML = '<option value="">전체</option>' + GUS.map(g => `<option>${g}</option>`).join("");

let hospitals = [];   // 공통 형식으로 변환한 병원 목록
let loaded = false;   // 데이터를 이미 받아왔는지

// 한 API의 모든 페이지를 불러오기
async function fetchAll(endpoint, extra) {
  let page = 1, all = [], total = Infinity;
  while (all.length < total) {
    const p = new URLSearchParams({ serviceKey: SERVICE_KEY, Q0: "서울특별시", ...extra, pageNo: page, numOfRows: 1000, _type: "json" });
    const res = await fetch(BASE + endpoint + "?" + p);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const head = json.response?.header;
    if (head && head.resultCode !== "00") throw new Error("API " + head.resultCode + " " + head.resultMsg);
    const body = json.response?.body || {};
    total = Number(body.totalCount || 0);
    let items = body.items?.item || [];
    if (!Array.isArray(items)) items = [items];
    all = all.concat(items);
    if (items.length === 0) break;
    page++;
  }
  return all;
}

// 시간 문자열(예: "0900") 해석
const hm = v => { if (!v) return null; const s = String(v).padStart(4, "0"); return Number(s.slice(0, 2)) * 60 + Number(s.slice(2)); };
function fmtTime(it, d) { // d: 1=월 ... 7=일, 8=공휴일
  const s = it["dutyTime" + d + "s"], c = it["dutyTime" + d + "c"];
  if (!s || !c) return null;
  const f = v => String(v).padStart(4, "0").replace(/(\d\d)(\d\d)/, "$1:$2");
  return f(s) + " ~ " + f(c);
}

// 병원 종류 판별 (API 응답에 있는 이름·구분값 기준)
function classify(it, fromBaby) {
  const t = (it.dutyName || "") + " " + (it.dutyDivNam || it.dutyDivName || "") + " " + (it.dutyEmclsName || "");
  if (t.includes("달빛")) return "달빛어린이병원";
  if (fromBaby) return t.includes("응급") || t.includes("센터") ? "소아전문응급의료센터" : "소아전문기관(분류 미확인)";
  return "일반 소아청소년과";
}

// 두 API 응답을 공통 형식으로 변환
function normalize(it, fromBaby) {
  return {
    id: it.hpid || (it.dutyName + it.dutyAddr),
    name: it.dutyName || "정보 없음",
    type: classify(it, fromBaby),
    addr: it.dutyAddr || "",
    tel: it.dutyTel1 || "",
    er: it.dutyEryn === 1 || it.dutyEryn === "1" ? "운영" : it.dutyEryn === 2 || it.dutyEryn === "2" ? "미운영" : "",
    lat: Number(it.wgs84Lat) || null,
    lng: Number(it.wgs84Lon) || null,
    raw: it
  };
}

async function load() {
  const [a, b] = await Promise.all([
    fetchAll("getBabyListInfoInqire", {}),
    fetchAll("getHsptlMdcncListInfoInqire", { QD: "D002" })
  ]);
  const map = new Map();
  // 중복 제거: 기관명+주소 기준 (달빛/응급센터 정보 우선)
  [...a.map(x => normalize(x, true)), ...b.map(x => normalize(x, false))].forEach(h => {
    const k = h.name.replace(/\s/g, "") + "|" + h.addr.replace(/\s/g, "");
    if (!map.has(k)) map.set(k, h);
  });
  hospitals = [...map.values()];
  loaded = true;
}

// 야간(20시 이후 진료), 휴일(토·일·공휴일 운영), 현재 진료 여부
function hasNight(h) { return [1,2,3,4,5,6,7].some(d => { const c = hm(h.raw["dutyTime"+d+"c"]); return c !== null && c >= 1200 + 480; }); }
function hasHoliday(h) { return [6,7,8].some(d => fmtTime(h.raw, d)); }
function openNow(h) {
  const now = new Date(), d = now.getDay() === 0 ? 7 : now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  const s = hm(h.raw["dutyTime"+d+"s"]), c = hm(h.raw["dutyTime"+d+"c"]);
  if (s === null || c === null) return false; // 정보 없으면 판단하지 않음
  return m >= s && m < c;
}

function search() {
  const gu = $("gu").value, types = [...document.querySelectorAll(".type:checked")].map(x => x.value);
  return hospitals.filter(h =>
    (!gu || h.addr.includes(gu)) &&
    (!types.length || types.includes(h.type)) &&
    (!$("night").checked || hasNight(h)) &&
    (!$("holiday").checked || hasHoliday(h)) &&
    (!$("now").checked || openNow(h))
  );
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const v = x => x ? esc(x) : "정보 없음";

function render(list) {
  $("status").textContent = "검색 결과 " + list.length + "곳";
  if (!list.length) { $("list").innerHTML = '<p>검색 조건에 맞는 병원이 없습니다.</p>'; return; }
  $("list").innerHTML = list.map((h, i) => `
    <div class="card" data-i="${i}">
      <span class="tag">${esc(h.type)}</span>
      <h3>${esc(h.name)}</h3>
      <dl>
        <dt>주소</dt><dd>${v(h.addr)}</dd>
        <dt>전화번호</dt><dd>${h.tel ? `<a href="tel:${esc(h.tel.replace(/[^0-9+]/g, ""))}">${esc(h.tel)}</a>` : "정보 없음"}</dd>
        <dt>평일</dt><dd>${v(fmtTime(h.raw, 1))}</dd>
        <dt>토요일</dt><dd>${v(fmtTime(h.raw, 6))}</dd>
        <dt>일요일·공휴일</dt><dd>${v([fmtTime(h.raw, 7) && "일 " + fmtTime(h.raw, 7), fmtTime(h.raw, 8) && "공휴일 " + fmtTime(h.raw, 8)].filter(Boolean).join(" / "))}</dd>
        <dt>응급실</dt><dd>${v(h.er)}</dd>
      </dl>
    </div>`).join("");
  document.querySelectorAll(".card").forEach(el => el.onclick = () => {
    document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel"));
    el.classList.add("sel");
    onSelect(list[el.dataset.i]); // 카카오맵 연동 지점
  });
}

// 카카오맵 연동 지점: 다음 프롬프트에서 구현
function onSelect(h) {}

function showError(e) {
  let msg = "병원 정보를 불러오지 못했습니다.";
  const t = String(e.message || e);
  if (t.includes("Failed to fetch")) msg += "\n브라우저 보안(CORS) 또는 네트워크 문제일 수 있습니다. 인터넷 연결을 확인하고, 계속되면 간단한 로컬 서버(예: VS Code Live Server)나 프록시를 통해 실행해 주세요.";
  else if (t.includes("API 30") || t.includes("API 31") || t.includes("HTTP 401") || t.includes("HTTP 403")) msg += "\n인증키가 올바르지 않거나 아직 활성화되지 않았습니다. 공공데이터포털에서 키와 활용신청 상태를 확인해 주세요.";
  else msg += "\n" + t;
  $("error").textContent = msg; $("error").style.display = "block";
}

$("go").onclick = async () => {
  $("error").style.display = "none";
  try {
    if (!loaded) { $("status").textContent = "병원 정보를 불러오는 중..."; $("list").innerHTML = ""; await load(); }
    render(search());
  } catch (e) { $("status").textContent = ""; showError(e); }
};
// 조건을 바꾸면 이미 불러온 데이터로 바로 다시 검색
["gu", "night", "holiday", "now"].forEach(id => $(id).onchange = () => loaded && render(search()));
// 병원 종류 복수 선택: '전체'를 켜면 나머지 해제, 개별 선택하면 '전체' 해제
const typeBoxes = [...document.querySelectorAll(".type")];
const refresh = () => loaded && render(search());
$("typeAll").onchange = () => { if ($("typeAll").checked) typeBoxes.forEach(b => b.checked = false); else if (!typeBoxes.some(b => b.checked)) $("typeAll").checked = true; refresh(); };
typeBoxes.forEach(b => b.onchange = () => { $("typeAll").checked = !typeBoxes.some(x => x.checked); refresh(); });
</script>
</body>
</html>
